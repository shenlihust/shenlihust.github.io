<p class="eyebrow">知其所以 / ARCHITECTURE NOTE 01</p><h1>Harness：把模型决策接入真实工作</h1>
<p class="intro">运行时组织上下文、协调执行并记录证据；真实结果回到下一轮决策，任务才能持续推进。</p>
